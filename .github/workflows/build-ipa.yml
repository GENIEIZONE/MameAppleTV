name: Build MameAppleTV Unsigned IPA

on:
  workflow_dispatch: # 수동으로 빌드를 실행할 수 있게 하는 트리거

jobs:
  build:
    runs-on: macos-14 # 구형 프로젝트 호환성을 위해 최신 버전 대신 13 할당

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Unsigned App
        run: |
          # 프로젝트 설정에 하드코딩된 모든 누락 롬파일을 가짜로 일괄 생성
          mkdir -p res/roms
          touch res/roms/timeplt.zip
          touch res/roms/raiden.zip
          touch res/roms/pacman.zip
          touch res/roms/galaga.zip
          touch res/roms/dkong.zip
          
          xcodebuild clean build \
            -project "iMAME4tvOS.xcodeproj" \
            -configuration Release \
            -sdk appletvos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            TVOS_DEPLOYMENT_TARGET=12.0
            
      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Release-appletvos/*.app Payload/
          zip -r MameAppleTV.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MameAppleTV-Unsigned-IPA
          path: MameAppleTV.ipa
